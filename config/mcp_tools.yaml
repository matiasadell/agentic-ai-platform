# FinSight AI - MCP (Model Context Protocol) Configuration
# ========================================================
# MCP allows standardized connection to external data sources
# Docs: https://modelcontextprotocol.io/

# MCP Server Configuration
mcp:
  enabled: true
  
  # Global settings
  settings:
    timeout: 30
    retry_attempts: 3
    log_requests: true

# MCP Servers
# Each server exposes a set of tools that agents can use
servers:
  # Financial Data Server
  financial_data:
    enabled: true
    command: "python"
    args: ["-m", "src.mcp_servers.financial_data_server"]
    
    # Tools exposed by this server
    tools:
      - name: "get_stock_price"
        description: "Get current or historical stock price"
        provider: "alpha_vantage"
      
      - name: "get_exchange_rate"
        description: "Get forex exchange rates"
        provider: "alpha_vantage"
      
      - name: "get_macro_indicator"
        description: "Get macroeconomic indicators (GDP, inflation, etc.)"
        provider: "alpha_vantage"
      
      - name: "get_bcra_data"
        description: "Get Argentine Central Bank (BCRA) data"
        provider: "bcra_api"
    
    # Environment variables for this server
    env:
      ALPHA_VANTAGE_API_KEY: "${ALPHA_VANTAGE_API_KEY}"
      BCRA_API_KEY: "${BCRA_API_KEY}"
    
    # Caching configuration
    cache:
      enabled: true
      ttl: 900  # 15 minutes
  
  # News & Web Search Server
  news_search:
    enabled: true
    command: "python"
    args: ["-m", "src.mcp_servers.news_search_server"]
    
    tools:
      - name: "search_news"
        description: "Search for news articles on a topic"
        provider: "tavily"
      
      - name: "search_web"
        description: "General web search"
        provider: "tavily"
      
      - name: "get_news_by_source"
        description: "Get news from specific sources"
        provider: "news_api"
    
    env:
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
      NEWS_API_KEY: "${NEWS_API_KEY}"
    
    cache:
      enabled: true
      ttl: 3600  # 1 hour
  
  # SEC Filings Server
  sec_filings:
    enabled: true
    command: "python"
    args: ["-m", "src.mcp_servers.sec_filings_server"]
    
    tools:
      - name: "search_filings"
        description: "Search SEC EDGAR filings by company, type, date"
        provider: "sec_api"
      
      - name: "get_filing_content"
        description: "Retrieve full content of a specific filing"
        provider: "sec_api"
      
      - name: "extract_financial_data"
        description: "Extract structured financial data from filings"
        provider: "sec_api"
    
    env:
      SEC_API_KEY: "${SEC_API_KEY}"
    
    cache:
      enabled: true
      ttl: 86400  # 24 hours
  
  # Knowledge Graph Server (Neo4j)
  knowledge_graph:
    enabled: true
    command: "python"
    args: ["-m", "src.mcp_servers.knowledge_graph_server"]
    
    tools:
      - name: "query_graph"
        description: "Execute Cypher queries on the knowledge graph"
        provider: "neo4j"
      
      - name: "find_relationships"
        description: "Find relationships between entities"
        provider: "neo4j"
      
      - name: "get_entity_info"
        description: "Get detailed information about an entity"
        provider: "neo4j"
      
      - name: "traverse_path"
        description: "Find paths between two entities"
        provider: "neo4j"
    
    env:
      NEO4J_URI: "${NEO4J_URI}"
      NEO4J_USER: "${NEO4J_USER}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      NEO4J_DATABASE: "${NEO4J_DATABASE}"
    
    cache:
      enabled: true
      ttl: 1800  # 30 minutes
  
  # Financial Calculators Server
  calculators:
    enabled: true
    command: "python"
    args: ["-m", "src.mcp_servers.calculators_server"]
    
    tools:
      - name: "calculate_ratios"
        description: "Calculate financial ratios (P/E, ROE, Debt/Equity, etc.)"
        provider: "internal"
      
      - name: "calculate_technical_indicators"
        description: "Calculate technical indicators (RSI, MACD, Bollinger Bands, etc.)"
        provider: "internal"
      
      - name: "calculate_valuation"
        description: "Calculate company valuation metrics"
        provider: "internal"
      
      - name: "compare_companies"
        description: "Compare financial metrics between companies"
        provider: "internal"
    
    env: {}
    
    cache:
      enabled: false  # Calculations are fast, no need to cache
  
  # Vector Search Server (Databricks)
  vector_search:
    enabled: true
    command: "python"
    args: ["-m", "src.mcp_servers.vector_search_server"]
    
    tools:
      - name: "search_documents"
        description: "Semantic search in document corpus"
        provider: "databricks"
      
      - name: "search_memory"
        description: "Search past research history"
        provider: "databricks"
      
      - name: "hybrid_search"
        description: "Combine semantic and keyword search"
        provider: "databricks"
    
    env:
      DATABRICKS_HOST: "${DATABRICKS_HOST}"
      DATABRICKS_TOKEN: "${DATABRICKS_TOKEN}"
      DATABRICKS_VECTOR_SEARCH_ENDPOINT: "${DATABRICKS_VECTOR_SEARCH_ENDPOINT}"
    
    cache:
      enabled: true
      ttl: 600  # 10 minutes

# Tool Access Control
# Define which agents can access which tools
access_control:
  # Level 1 - Orchestrator
  orchestrator:
    allowed_servers:
      - financial_data
      - news_search
      - knowledge_graph
      - vector_search
  
  # Level 2 - Supervisors
  macro_supervisor:
    allowed_servers:
      - financial_data
      - calculators
  
  fundamental_supervisor:
    allowed_servers:
      - sec_filings
      - financial_data
      - calculators
      - knowledge_graph
  
  news_supervisor:
    allowed_servers:
      - news_search
      - knowledge_graph
  
  # Level 3 - Workers
  macro_data_worker:
    allowed_servers:
      - financial_data
  
  regional_context_worker:
    allowed_servers:
      - news_search
      - knowledge_graph
  
  indicator_analysis_worker:
    allowed_servers:
      - financial_data
      - calculators
  
  sec_filings_worker:
    allowed_servers:
      - sec_filings
      - vector_search
  
  ratio_calculator_worker:
    allowed_servers:
      - calculators
  
  comparative_worker:
    allowed_servers:
      - financial_data
      - calculators
  
  graph_relationship_worker:
    allowed_servers:
      - knowledge_graph
  
  news_ingestion_worker:
    allowed_servers:
      - news_search
  
  sentiment_worker:
    allowed_servers:
      - news_search
  
  event_detection_worker:
    allowed_servers:
      - news_search
  
  contradiction_detector_worker:
    allowed_servers:
      - news_search
      - sec_filings
      - knowledge_graph

# Monitoring
monitoring:
  enabled: true
  
  # Track tool usage
  track_usage: true
  
  # Track latency per tool
  track_latency: true
  
  # Track errors
  track_errors: true
  
  # Export metrics
  export_to:
    - prometheus
    - langsmith
    - mlflow

# Error Handling
error_handling:
  # Retry configuration
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: 1
    max_delay: 30
  
  # Fallback behavior
  fallback:
    enabled: true
    # If a tool fails, try alternative tools or return graceful error
    strategy: "return_error_message"
  
  # Circuit breaker
  circuit_breaker:
    enabled: true
    failure_threshold: 5  # failures
    timeout: 60  # seconds
    half_open_attempts: 2
