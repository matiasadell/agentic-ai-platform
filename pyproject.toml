[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-ai"
version = "0.1.0"
description = "Plataforma de Inteligencia Financiera Autónoma con Arquitectura Multi-Agente Jerárquica"
authors = [
    {name = "Matias Adell", email = "matiasadell@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agents", "finance", "rag", "langgraph", "neo4j", "mcp", "litellm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core Agent Framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    
    # LLM Gateway & Routing
    "litellm>=1.51.0",
    "litellm[proxy]>=1.51.0",
    
    # Model Context Protocol (MCP)
    "mcp>=1.1.0",
    
    # LLM Providers
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    
    # Vector Stores & Embeddings
    "databricks-vectorsearch>=0.40",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    
    # Graph Database
    "neo4j>=5.24.0",
    "langchain-neo4j>=0.1.0",
    
    # Web APIs & Data Sources
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "tavily-python>=0.5.0",
    "alpha-vantage>=2.3.1",
    "yfinance>=0.2.48",
    "sec-api>=1.0.19",
    
    # Database & Storage
    "databricks-sdk>=0.38.0",
    "delta-spark>=3.2.1",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.0",
    
    # Data Processing
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    
    # Observability & Tracking
    "langsmith>=0.2.0",
    "mlflow>=2.18.0",
    "prometheus-client>=0.21.0",
    
    # Evaluation
    "ragas>=0.2.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.29.0",
    "jupyter>=1.1.0",
]

airflow = [
    "apache-airflow>=2.10.0",
    "apache-airflow-providers-databricks>=6.11.0",
]

monitoring = [
    "grafana-api>=1.0.3",
    "prometheus-api-client>=0.5.5",
]

[project.urls]
Homepage = "https://github.com/matiasadell/agentic-ai-platform"
Documentation = "https://github.com/matiasadell/agentic-ai-platform/docs"
Repository = "https://github.com/matiasadell/agentic-ai-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
